server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SIIMS is entirely client-side: all state lives in the browser's
    # localStorage, so there is no API to proxy. Every path falls through to
    # index.html for React Router to resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
